name: asur_find
description: >-
  asur-find — Safe Deep Cleaning Utility. Native macOS-styled dashboard
  (macos_ui) running as a Windows desktop application.
publish_to: "none"
version: 0.1.0

environment:
  # Requires Flutter 3.24+ / Dart 3.5+
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Native macOS Human Interface components: MacosWindow, Sidebar,
  # PushButton, MacosListTile, SF-flavored Typography.
  macos_ui: ^2.1.0
  # Glyph font required by CupertinoIcons used inside MacosIcon widgets.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # No Material icons/assets used anywhere in this app.
  uses-material-design: false
